apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskly-api
  namespace: default
  labels:
    app: taskly-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskly-api
  template:
    metadata:
      labels:
        app: taskly-api
    spec:
      containers:
        - name: taskly-api
          image: 686699774218.dkr.ecr.us-east-1.amazonaws.com/taskly-sushmitha-api:stage5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskly-api-secret
                  key: DATABASE_URL

            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: taskly-api-config
                  key: REDIS_URL

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
