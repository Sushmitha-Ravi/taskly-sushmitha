apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: taskly-cicd
  namespace: default
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - patch
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: taskly-cicd
  namespace: default
subjects:
  - kind: Group
    name: taskly-cicd
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: taskly-cicd
  apiGroup: rbac.authorization.k8s.io
