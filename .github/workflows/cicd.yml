name: Taskly CI/CD

on:
  push:
    branches:
      - taskly-development

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: taskly-sushmitha-api
  EKS_CLUSTER: taskly-sushmitha-eks
  DEPLOYMENT_NAME: taskly-api
  CONTAINER_NAME: taskly-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python application
        run: |
          python -m compileall \
            main.py \
            database.py \
            models.py \
            redis_client.py \
            logging_config.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::686699774218:role/taskly-sushmitha-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Verify Kubernetes access
        run: |
          kubectl get deployment "$DEPLOYMENT_NAME"
          kubectl get pods -l app=taskly-api

      - name: Deploy new image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/"$DEPLOYMENT_NAME" \
            "$CONTAINER_NAME=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/"$DEPLOYMENT_NAME" \
            --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deployment "$DEPLOYMENT_NAME"
          kubectl get pods -l app=taskly-api
          kubectl get service taskly-api

      - name: Verify application health
        run: |
          LOAD_BALANCER=$(kubectl get service taskly-api -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          if [ -z "$LOAD_BALANCER" ]; then
            echo "LoadBalancer hostname was not assigned"
            exit 1
          fi

          echo "LoadBalancer: $LOAD_BALANCER"

          curl --fail --silent --show-error \
            "http://$LOAD_BALANCER/health"
